---
# If you leave lwmp-start.rb in localwebmediaplayer/tools/script/lwmp-start.rb, you can omit it.
repo: /path/to/repository
# lighttpd_cmd: Optional. By default, the startup script attempts to launch Lighttpd using the command `lighttpd`.  
#  If a different command is required, it can be specified here.
#lighttpd_cmd: /usr/bin/lighttpd
# ruby: The path to the Ruby binary. You cannot specify it along with arguments.
#ruby: /usr/bin/ruby
# ffprobe: command to ffprobe. Use `ffprobe` by default.
#ffprobe: /usr/local/bin/ffprobe
profiles:
  foo: # foo is profile name
    # media: Required parameter. Points to the root directory when accessed as a web application. It is the absolute path to the directory that will become the media library.
    media: /home/foo/Music
    # data_root: Required parameter. Specifies the directory for storing data generated by LWMP. This directory is exposed to clients as /info.
    data_root: /home/foo/.local/state/lwmp/foo
    # cache_root: Required parameter. Used to store transcoding data and is exposed to clients as /transcode. Even if all transcoding-related features are disabled, the directory itself must exist and this value must be set.
    cache_root: /home/foo/.cache/lwmp/foo
    # port: Required parameter. Specifies the port for the web server (Lighttpd).  
    #   Make sure that simultaneously running profiles do not use overlapping ports.
    port: 8000
    # name: Optional. Specifies a name to identify the server instance.  
    #   If omitted, the profile name will be used by default.  
    #   In the future, this may be used for display by the SPA.
    #name: foo Media Music
    # metadata: Optional. Specifies the absolute path to the directory for string the metadata database.  
    #   The directory must already exist.
    #metadata: /home/foo/.local/state/lwmp/foo/metadata
    # use_metadata: Optional. Disabling metadata feature.
    #use_metadata: no
    # use_thumbnail: Optional. Disabling thumbnail feature.
    #use_thumbnail: no
    # exclude_exts: Optional. suffix list for excluding from file list.
    #exclude_exts: [.info.json, .html]
    # report_decode_error: Optional. If true, client reports path when encounted decoding error for cli/create-transcord.rb
    #report_decode_error: no